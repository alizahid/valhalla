[workspace]
resolver = "2"
members = [
    "crates/valhalla",
    "examples/kanban",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/alizahid/valhalla"

[workspace.dependencies]
gpui            = "0.2"
gpui-component  = "0.5"
rquickjs        = { version = "0.11", features = ["macro", "loader", "futures"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
anyhow          = "1"
ureq            = "2"
tungstenite     = "0.21"
parking_lot     = "0.12"
crossbeam-channel = "0.5"
log             = "0.4"
env_logger      = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The published gpui 0.2.2 was built against an older Metal SDK; its shaders
# fail to compile on current Xcode (zed#46486). Override both our direct dep
# and gpui-component's transitive dep with the upstream main branch, which
# longbridge/gpui-component tracks too.
[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed" }
# gpui-component 0.5.1 on crates.io tracks an older gpui API; their main
# branch keeps pace with Zed's main, which our gpui patch above tracks.
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
