[workspace]
resolver = "2"
members = [
    "crates/valhalla",
    "examples/kanban",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/alizahid/valhalla"

[workspace.dependencies]
gpui            = "0.2"
gpui-component  = "0.5"
rquickjs        = { version = "0.11", features = ["macro", "loader", "futures"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
anyhow          = "1"
ureq            = "2"
tungstenite     = "0.21"
parking_lot     = "0.12"
crossbeam-channel = "0.5"
log             = "0.4"
env_logger      = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
